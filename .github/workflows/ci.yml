name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Package
        run: pnpm exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: better-codex-info-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: better-codex-info-*
          path: artifacts
          merge-multiple: true

      - name: Verify release metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          notes="docs/releases/${TAG}.md"
          test "${TAG}" = "v${package_version}"
          test -f "${notes}"
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            test "${draft}" = "true"
            gh release upload "${TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Better Codex Info ${TAG}" \
              --notes-file "docs/releases/${TAG}.md" \
              --draft
          fi

      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(find artifacts -maxdepth 1 -type f | wc -l)"
          actual="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          test "${expected}" -eq "${actual}"
          mkdir verified
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir verified
          (
            cd verified
            sha256sum --check SHA256SUMS.txt
          )
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
